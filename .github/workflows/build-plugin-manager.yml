name: Build Moaz Elgabry Plugins

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL: ${{ vars.MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "docs/updates/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".gitignore"
      - "README.md"
      - ".github/workflows/build-plugin-manager.yml"

concurrency:
  group: plugin-manager-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.release_guard.outputs.release_tag }}
      release_id: ${{ steps.release_guard.outputs.release_id }}
      should_build: ${{ steps.release_guard.outputs.should_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Resolve app version
        id: version
        run: |
          echo "app_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate receipt verification key
        run: |
          node <<'NODE'
          const key = process.env.MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL || '';
          if (!/^[A-Za-z0-9_-]{43}$/.test(key)) {
            throw new Error('Set the MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL Actions variable to the unpadded Base64URL Ed25519 public key.');
          }
          const raw = Buffer.from(key, 'base64url');
          if (raw.length !== 32 || raw.toString('base64url') !== key) {
            throw new Error('The receipt public key must decode to exactly 32 bytes in canonical unpadded Base64URL form.');
          }
          NODE

      - name: Guard release state for this version
        id: release_guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $tag = "plugin-manager-v$env:APP_VERSION"
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release lookup failed with exit code $LASTEXITCODE."
          }
          $releases = $releasesJson | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $release) {
            Write-Host "No existing release found for $tag. Creating draft release shell."
            $createdReleaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases" `
              --method POST `
              --field tag_name="$tag" `
              --field target_commitish="$env:GITHUB_SHA" `
              --field name="Moaz Elgabry Plugins v$env:APP_VERSION" `
              --field body="See the release assets for desktop build artifacts." `
              --field draft=true `
              --field prerelease=false
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub rejected draft creation for $tag with exit code $LASTEXITCODE."
            }
            $createdRelease = $createdReleaseJson | ConvertFrom-Json
            if (-not $createdRelease -or $createdRelease.tag_name -ne $tag -or -not $createdRelease.draft) {
              throw "GitHub did not return the expected draft release for $tag."
            }
            "release_tag=$tag" >> $env:GITHUB_OUTPUT
            "release_id=$($createdRelease.id)" >> $env:GITHUB_OUTPUT
            "should_build=true" >> $env:GITHUB_OUTPUT
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Created draft release shell for $tag."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Release URL: $($createdRelease.html_url)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Release ID: $($createdRelease.id)"
            exit 0
          }
          $releaseUrl = if ($release.html_url) { $release.html_url } else { "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" }
          $assetCount = @($release.assets).Count
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT
          if ($release.draft) {
            "should_build=true" >> $env:GITHUB_OUTPUT
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Reusing the draft release for $tag. The final publish job will replace matching assets with the complete platform set."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Release URL: $releaseUrl"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Release ID: $($release.id)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Existing assets: $assetCount"
            Write-Host "Draft release already exists for $tag. Rebuilding all platforms and replacing matching assets."
            exit 0
          } else {
            "should_build=false" >> $env:GITHUB_OUTPUT
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Release build skipped because $tag is already published."
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Release URL: $releaseUrl"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Release ID: $($release.id)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Draft: $($release.draft)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Prerelease: $($release.prerelease)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Assets found: $assetCount"
          Write-Host "Release already exists for $tag. Preserving it and skipping build."
          exit 0

  build:
    needs: prepare_release
    if: needs.prepare_release.outputs.should_build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
          - platform: ubuntu-latest
            args: "--bundles appimage"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Pin macOS Cargo executable
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo_path="$(rustup which cargo)"
          cargo_dir="$(dirname "${cargo_path}")"
          echo "${cargo_dir}" >> "${GITHUB_PATH}"
          echo "CARGO=${cargo_path}" >> "${GITHUB_ENV}"
          "${cargo_path}" --version
          "${cargo_path}" metadata --manifest-path src-tauri/Cargo.toml --no-deps >/dev/null

      - name: Install macOS universal Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Rust LLVM tools for macOS binary stripping
        if: matrix.platform == 'macos-latest'
        run: rustup component add llvm-tools-preview

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build platform installer and updater signatures
        run: npm run tauri:build -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL: ${{ vars.MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL }}

      - name: Upload Windows workflow artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: manager-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

      - name: Upload macOS workflow artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: manager-build-${{ matrix.platform }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload Linux workflow artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: manager-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  publish_release:
    needs:
      - prepare_release
      - build
    if: needs.prepare_release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: manager-build-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete platform asset set
        env:
          APP_VERSION: ${{ needs.prepare_release.outputs.app_version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function filesUnder(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(directory, entry.name);
              return entry.isDirectory() ? filesUnder(fullPath) : [fullPath];
            });
          }

          function exactlyOne(files, predicate, label) {
            const matches = files.filter(predicate);
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one ${label}; found ${matches.length}.`);
            }
            return matches[0];
          }

          const files = filesUnder('release-assets');
          const byName = new Map();
          for (const file of files) {
            const name = path.basename(file);
            if (byName.has(name)) {
              throw new Error(`Duplicate release asset filename: ${name}`);
            }
            byName.set(name, file);
          }
          const version = process.env.APP_VERSION;
          const windows = exactlyOne(files, (file) => path.basename(file) === `Moaz Elgabry Plugins_${version}_x64-setup.exe`, 'Windows installer');
          const linux = exactlyOne(files, (file) => path.basename(file) === `Moaz Elgabry Plugins_${version}_amd64.AppImage`, 'Linux AppImage');
          const macDmg = exactlyOne(files, (file) => path.basename(file) === `Moaz Elgabry Plugins_${version}_universal.dmg`, 'macOS DMG');
          const macUpdater = exactlyOne(files, (file) => path.basename(file) === 'Moaz Elgabry Plugins.app.tar.gz', 'macOS updater archive');
          const required = [
            path.basename(windows),
            `${path.basename(windows)}.sig`,
            path.basename(linux),
            `${path.basename(linux)}.sig`,
            path.basename(macDmg),
            path.basename(macUpdater),
            `${path.basename(macUpdater)}.sig`
          ];
          for (const name of required) {
            if (!byName.has(name)) {
              throw new Error(`Required platform asset or signature is missing: ${name}`);
            }
            if (fs.statSync(byName.get(name)).size === 0) {
              throw new Error(`Required platform asset or signature is empty: ${name}`);
            }
          }
          const extras = [...byName.keys()].filter((name) => !required.includes(name));
          if (extras.length > 0) {
            throw new Error(`Unexpected files in the release package: ${extras.join(', ')}`);
          }
          console.log(`Verified all ${required.length} release assets for version ${version}.`);
          NODE

      - name: Upload all platforms to the single version draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
          APP_VERSION: ${{ needs.prepare_release.outputs.app_version }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r '.tag_name' <<<"$release_json")" != "$RELEASE_TAG" ]]; then
            echo "Release ID ${RELEASE_ID} does not match expected tag ${RELEASE_TAG}."
            exit 1
          fi
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
            echo "The target release is not a draft; refusing to replace assets."
            exit 1
          fi
          upload_url="$(jq -r '.upload_url' <<<"$release_json" | sed 's/{?name,label}$//')"
          while IFS= read -r -d '' file; do
            asset_name="$(basename "$file")"
            existing_asset_id="$(jq -r --arg name "$asset_name" '.assets[]? | select(.name == $name) | .id' <<<"$release_json" | head -n 1)"
            if [[ -n "$existing_asset_id" ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}" --method DELETE
            fi
            encoded_name="$(jq -rn --arg name "$asset_name" '$name | @uri')"
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "${upload_url}?name=${encoded_name}" > /dev/null
            echo "Uploaded ${asset_name} to draft ${RELEASE_TAG}."
          done < <(find release-assets -type f -print0)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release-after-upload.json
          node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync('release-after-upload.json', 'utf8'));
          const names = new Set((release.assets ?? []).map((asset) => asset.name));
          const version = process.env.APP_VERSION;
          // GitHub normalizes spaces in release asset names to periods.
          const required = [
            `Moaz.Elgabry.Plugins_${version}_x64-setup.exe`,
            `Moaz.Elgabry.Plugins_${version}_x64-setup.exe.sig`,
            `Moaz.Elgabry.Plugins_${version}_amd64.AppImage`,
            `Moaz.Elgabry.Plugins_${version}_amd64.AppImage.sig`,
            `Moaz.Elgabry.Plugins_${version}_universal.dmg`,
            'Moaz.Elgabry.Plugins.app.tar.gz',
            'Moaz.Elgabry.Plugins.app.tar.gz.sig'
          ];
          const missing = required.filter((name) => !names.has(name));
          if (!release.draft || missing.length) {
            throw new Error(`Release verification failed. Draft=${release.draft}; missing=${missing.join(', ') || 'none'}`);
          }
          console.log(`Verified ${required.length} assets on draft ${release.tag_name}.`);
          NODE
